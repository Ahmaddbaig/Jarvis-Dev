name: Refactor CI

on:
  pull_request:
  push:
    branches:
      - develop
      - refactor

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            os: ubuntu-latest
          - name: macOS arm64
            os: macos-14
          - name: Windows x64
            os: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Use Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/computer-use-requirements.txt

      - name: Install Node dependencies
        run: npm ci

      - name: Run quality gate
        run: npm run check

      - name: Build native helper, Next runtime, and Electron source
        run: npm run build
        env:
          JARVIS_BUILD_PYTHON: python

      - name: Verify assembled runtime
        shell: bash
        run: |
          test -f .next/standalone/server.js
          test -f .next/standalone/scripts/computer_use.py
          test -f .next/standalone/scripts/dist/computer_use || test -f .next/standalone/scripts/dist/computer_use.exe
          test ! -e .next/standalone/jarvis-server-settings.json
          test ! -e .next/standalone/jarvis-companions.json
          test ! -e .next/standalone/.jarvis-desktop-token

      - name: Upload native build evidence
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-${{ runner.os }}-${{ runner.arch }}-build-evidence
          path: |
            dist-electron/
            .next/standalone/scripts/dist/
          if-no-files-found: error
          retention-days: 7
