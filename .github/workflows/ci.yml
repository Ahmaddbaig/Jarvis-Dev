name: Refactor CI

on:
  pull_request:
  push:
    branches:
      - develop
      - refactor

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            os: ubuntu-latest
            arch: x64
          - name: macOS arm64
            os: macos-14
            arch: arm64
          - name: Windows x64
            os: windows-latest
            arch: x64

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Use Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            scripts/computer-use-requirements.txt
            services/ai-engine/requirements-runtime.txt
            services/ai-engine/requirements-dev.txt

      - name: Verify runner architecture
        run: node -e "if (process.arch !== '${{ matrix.arch }}') throw new Error('Expected ${{ matrix.arch }}, received ' + process.arch)"

      - name: Install Linux native build prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxtst-dev libpng++-dev

      - name: Install Node dependencies
        run: npm ci

      - name: Install AI engine dependencies
        run: npm run ai:setup

      - name: Verify lock integrity, licenses, and tracked secrets
        run: npm run release:supply-chain

      # Advisory, not blocking: the result depends on the advisory database at
      # the moment the job runs, so a newly published CVE would otherwise turn
      # an unchanged commit red. verify-supply-chain (above) holds the
      # deterministic gates. dependency-audit.yml chases advisories on a
      # schedule and opens an issue.
      - name: Report high and critical dependency advisories
        continue-on-error: true
        run: npm audit --audit-level=high

      - name: Run quality gate
        run: npm run check

      - name: Build native helper, Next runtime, and Electron source
        run: npm run build
        env:
          JARVIS_BUILD_PYTHON: python

      - name: Smoke-test frozen AI lifecycle and budgets
        run: npm run ai:smoke

      - name: Smoke-test pruned standalone runtime
        run: npm run release:smoke

      - name: Finalize release identity and SBOM
        run: npm run release:evidence

      - name: Verify assembled runtime
        shell: bash
        run: |
          test -f .next/standalone/server.js
          test -f .next/standalone/scripts/computer_use.py
          test -f .next/standalone/scripts/dist/computer_use || test -f .next/standalone/scripts/dist/computer_use.exe
          test -f services/ai-engine/dist/jarvis-ai-engine/jarvis-ai-engine || test -f services/ai-engine/dist/jarvis-ai-engine/jarvis-ai-engine.exe
          test -f .build/release-evidence/artifact-manifest.json
          test -f .build/release-evidence/sbom.cdx.json
          test -f .build/release-evidence/ai-smoke.json
          test -f .build/release-evidence/standalone-smoke.json
          test ! -e .next/standalone/jarvis-server-settings.json
          test ! -e .next/standalone/jarvis-companions.json
          test ! -e .next/standalone/.jarvis-desktop-token

      - name: Upload native build evidence
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-${{ runner.os }}-${{ runner.arch }}-build-evidence
          path: |
            dist-electron/
            .next/standalone/scripts/dist/
            .build/release-evidence/
          if-no-files-found: error
          retention-days: 7
